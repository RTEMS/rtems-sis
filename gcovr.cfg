# Coverage report settings, read by gcovr when run from the top of the tree
# after ./waf configure --enable-coverage && ./waf.

root = .
search-path = build

# The simulator sources are the denominator, headers included.  A subsystem
# converted to a policy template has its logic in a header, so measuring only
# the .cc files would drop that logic out of the report as it moves.  Most
# headers carry no code and simply report nothing.  The tests are not the
# subject, and the vendored and generated files are not ours to cover.
filter = .*\.cc$
filter = .*\.h$
exclude = tests/.*
exclude = main\.cc
exclude = doctest\.h
exclude = elf\.h
exclude = rv32dtb\.h

# gcov counts arcs, not source conditions, so every C++ function with a
# non-trivial local emits arcs to a landing pad that only an exception can
# take.  Those are not reachable from a test and are filtered out, together
# with the arcs gcov itself marks unreachable.  A branch percentage from this
# tree therefore means the filtered arc set, not every arc gcc emitted.
exclude-throw-branches = yes
exclude-unreachable-branches = yes

txt-metric = branch
